
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo | Mi Página</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            max-width: 750px;
            width: 100%;
            text-align: center;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            animation: aparecer 1s ease;
        }

        .etiqueta {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 13px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: clamp(40px, 8vw, 65px);
            margin-bottom: 20px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #cbd5e1;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .cards {
            display: flex;
            gap: 15px;
            margin: 35px 0;
        }

        .card {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px 10px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s, background 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
            background: rgba(56, 189, 248, 0.1);
        }

        .card span {
            display: block;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .card h3 {
            font-size: 15px;
            margin-bottom: 5px;
        }

        .card small {
            color: #94a3b8;
        }

        button {
            background: linear-gradient(90deg, #0284c7, #6366f1);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.3);
        }

        footer {
            margin-top: 40px;
            color: #64748b;
            font-size: 13px;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 550px) {
            .container {
                padding: 40px 20px;
            }

            .cards {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <span class="etiqueta">MI PRIMER PROYECTO WEB</span>

        <h1>¡Hola Mundo!</h1>

        <p>
            Bienvenido a mi primera página web.
            Un pequeño espacio para experimentar,
            aprender y crear cosas increíbles con tecnología.
        </p>

        <div class="cards">

            <div class="card">
                <span>🌐</span>
                <h3>HTML</h3>
                <small>Estructura</small>
            </div>

            <div class="card">
                <span>🎨</span>
                <h3>CSS</h3>
                <small>Diseño</small>
            </div>

            <div class="card">
                <span>⚡</span>
                <h3>JavaScript</h3>
                <small>Interactividad</small>
            </div>

        </div>

        <button onclick="saludar()">
            ¡Hacé clic acá!
        </button>

        <footer>
            Desarrollado con HTML, CSS y JavaScript
            <br><br>
            © 2026 - Mi primera página web
        </footer>

    </main>

    <script>
        function saludar() {
            alert("¡Hola! Gracias por visitar mi página web 🚀");
        }
    </script>

</body>
</html>
